name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit fix --package-lock-only
      - name: Commit resolved lockfile
        if: github.head_ref == 'audit/security-hardening'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: commit audited dependency lockfile'
            git fetch origin audit/security-hardening
            git rebase origin/audit/security-hardening
            git push origin HEAD:audit/security-hardening
          fi
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node --check server.js
      - run: node --check public/admin.js
      - run: npm test
      - run: docker build -t whiteboard:test .

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Desktop/go.mod
          cache-dependency-path: Desktop/go.sum
      - run: mkdir -p frontend/dist && cp frontend/index.html frontend/app.js frontend/styles.css frontend/dist/
      - run: go test ./...
