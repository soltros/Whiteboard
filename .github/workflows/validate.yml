name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/admin.js
      - run: npm test
      - run: docker build -t whiteboard:test .

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Desktop/go.mod
          cache-dependency-path: Desktop/go.sum
      - run: mkdir -p frontend/dist && cp frontend/index.html frontend/app.js frontend/style.css frontend/dist/
      - run: go test ./...
